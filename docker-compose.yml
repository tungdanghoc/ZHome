services:
  # 1. SQL Server Database
  zhome-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zhome-db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-ZHomeStrongPassword2026!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./ZHome_fixed.sql:/docker-entrypoint-initdb.d/ZHome_fixed.sql:ro
    networks:
      - zhome-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD:-ZHomeStrongPassword2026!}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD:-ZHomeStrongPassword2026!}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. .NET 9 Web API
  zhome-api:
    build:
      context: ./ZHome.API
      dockerfile: Dockerfile
    container_name: zhome-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=zhome-db;Database=ZHome;User Id=sa;Password=${DB_PASSWORD:-ZHomeStrongPassword2026!};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - Jwt__Key=${JWT_KEY:-ZHome_SuperSecretKeyThatIsAtLeast32BytesLongForSecurity_2026}
      - EmailSettings__Username=${SMTP_USERNAME:-danghoangson2752k4@gmail.com}
      - EmailSettings__Password=${SMTP_PASSWORD:-hspbgixotgfspjfy}
      - SePay__ApiKey=${SEPAY_API_KEY:-PDXGMSZKKQE9D5TAYGB1FXH867VTRUEZMNEBR6B7GKC804NCIQQCAPIEL0NAXIAL}
      - PayOS__ClientId=${PAYOS_CLIENT_ID:-d28bcd32-18fb-4340-a36d-aaa724f4e510}
      - PayOS__ApiKey=${PAYOS_API_KEY:-232942dd-26a4-402d-9750-fb092c4007d1}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY:-6d5d3dfe1cd0de8fd0dfbf2c2e1af80bbfac2219147d30241404930094fbb810}
    ports:
      - "5000:5000"
    volumes:
      - zhome_uploads:/app/wwwroot/uploads
    depends_on:
      zhome-db:
        condition: service_healthy
    networks:
      - zhome-network

  # 3. Angular 19 Client with Nginx Web Server
  zhome-client:
    build:
      context: ./ZHome.Client
      dockerfile: Dockerfile
    container_name: zhome-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - zhome-api
    networks:
      - zhome-network

networks:
  zhome-network:
    driver: bridge

volumes:
  mssql_data:
  zhome_uploads:
